name: Extract Android Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q TBCPL-Android-GitHub.zip -d extracted

          if [ "$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] && \
             [ "$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)" = "0" ]; then
            DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -1)
            cp -a "$DIR"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f TBCPL-Android-GitHub.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Android project"
          git push
